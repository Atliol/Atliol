name: generate animation

on:
  # နေ့စဉ် အလိုအလျောက် Update လုပ်ပေးဖို့ (သို့မဟုတ် 1 နာရီတစ်ကြိမ်)
  schedule:
    - cron: "0 0 * * *"
  
  # GitHub ကို Manual (လက်ဖြင့်) တိုက်ရိုက် Run ချင်တဲ့အခါ သုံးဖို့
  workflow_dispatch:
  
  # main branch ကို push လုပ်တိုင်း Run ဖို့
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ၁။ Repository ထဲက ကုဒ်တွေကို ဆွဲထုတ်ရန်
      - name: checkout
        uses: actions/checkout@v3

      # ၂။ Snake Animation SVG ဖိုင်များကို ထုတ်လုပ်ရန်
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ၃။ ထွက်လာတဲ့ ပုံတွေကို output ဆိုတဲ့ branch ထဲသို့ တင်ရန်
      - name: push github-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
